[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
extend-select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
# 'src'를 패키지처럼 import 가능하도록 루트를 추가.
pythonpath = ["."]
