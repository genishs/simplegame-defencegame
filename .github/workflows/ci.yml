name: CI

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Issue #29 / DECISION-AUDIO-012: simpleaudio는 Linux에서 libasound2-dev 필요.
      # Windows 러너는 해당 없음 (조건부 실행).
      - name: Install Linux audio dev libraries (ubuntu only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libasound2-dev

      - name: Install dependencies (if requirements.txt exists)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            # DECISION-AUDIO-012: simpleaudio가 헤드리스 환경에서 설치 실패할 수 있음.
            # 설치 실패 시 SoundManager가 자동 no-op fallback으로 처리함.
            pip install -r requirements.txt || pip install -r requirements.txt --ignore-requires-python || true
          else
            echo "requirements.txt not found; skipping install."
          fi
          # 개발 도구 (있을 때만 동작 가능하도록 항상 설치)
          pip install ruff black pytest || true

      - name: Lint (ruff) — skip if no config or files
        shell: bash
        run: |
          if [ -f pyproject.toml ] || [ -f ruff.toml ] || [ -f .ruff.toml ]; then
            ruff check . || exit 1
          else
            # 설정이 없어도 Python 파일이 있으면 기본 규칙으로 점검
            if compgen -G "**/*.py" > /dev/null; then
              ruff check . || true
            else
              echo "No Python files; skipping ruff."
            fi
          fi

      - name: Format check (black) — best effort
        shell: bash
        run: |
          if compgen -G "**/*.py" > /dev/null; then
            black --check . || echo "::warning::black check failed or no formatting config; continuing."
          else
            echo "No Python files; skipping black."
          fi

      # CI 가드: src/systems/ 및 src/entities/ 에 런타임 tkinter import 금지
      # DECISION-4.1 — 도메인 계층 순수성 보장 (closes #8)
      # TYPE_CHECKING 가드 내 import 는 허용 (타입힌트 전용, 런타임 비실행)
      # 1차 방어선: grep (빠른 패턴 매칭 — TYPE_CHECKING 블록 제외)
      - name: Domain layer tk-free guard (grep)
        shell: bash
        run: |
          # grep 으로 tkinter import 포함 라인을 추출 후, TYPE_CHECKING 블록 내 라인 제외
          # 단순화: TYPE_CHECKING 라인 바로 다음 줄의 들여쓴 import 는 허용 패턴으로 처리
          # 정확한 판단은 2차 방어선(AST 스캔)에서 수행
          if grep -rn -E "^\s*(import|from)\s+tkinter" src/systems 2>/dev/null; then
            echo "ERROR: tkinter import detected in src/systems/ (domain layer)."
            echo "Domain must remain tk-independent. (DECISION-4.1, #8)"
            exit 1
          fi
          echo "OK: No tkinter imports found in src/systems/."

      # 2차 방어선: AST 기반 스크립트 (정확도 높음, 주석/문자열 오탐 없음)
      - name: Domain layer tk-free guard (AST)
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/check_systems_no_tk.py --verbose

      - name: Tests (pytest) — fast path (not slow)
        shell: bash
        run: |
          if [ -d tests ] || compgen -G "test_*.py" > /dev/null || compgen -G "**/test_*.py" > /dev/null; then
            pytest -q -m "not slow"
          else
            echo "No tests found; skipping pytest."
          fi

      - name: Tests (pytest) — audio markers
        shell: bash
        run: |
          if [ -d tests ]; then
            pytest -q -m audio
          else
            echo "No tests found; skipping pytest audio step."
          fi

      - name: Tests (pytest) — full suite including slow
        shell: bash
        run: |
          if [ -d tests ] || compgen -G "test_*.py" > /dev/null || compgen -G "**/test_*.py" > /dev/null; then
            pytest -q
          else
            echo "No tests found; skipping pytest."
          fi
