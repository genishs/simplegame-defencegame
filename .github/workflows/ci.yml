name: CI

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies (if requirements.txt exists)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found; skipping install."
          fi
          # 개발 도구 (있을 때만 동작 가능하도록 항상 설치)
          pip install ruff black pytest || true

      - name: Lint (ruff) — skip if no config or files
        shell: bash
        run: |
          if [ -f pyproject.toml ] || [ -f ruff.toml ] || [ -f .ruff.toml ]; then
            ruff check . || exit 1
          else
            # 설정이 없어도 Python 파일이 있으면 기본 규칙으로 점검
            if compgen -G "**/*.py" > /dev/null; then
              ruff check . || true
            else
              echo "No Python files; skipping ruff."
            fi
          fi

      - name: Format check (black) — best effort
        shell: bash
        run: |
          if compgen -G "**/*.py" > /dev/null; then
            black --check . || echo "::warning::black check failed or no formatting config; continuing."
          else
            echo "No Python files; skipping black."
          fi

      - name: Tests (pytest)
        shell: bash
        run: |
          if [ -d tests ] || compgen -G "test_*.py" > /dev/null || compgen -G "**/test_*.py" > /dev/null; then
            pytest -q
          else
            echo "No tests found; skipping pytest."
          fi
