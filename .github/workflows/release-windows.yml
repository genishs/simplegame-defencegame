name: Release Windows (release/win64/prd)

on:
  push:
    branches:
      - 'release/win64/prd'
    tags:
      - 'v*'

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: PyInstaller + GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          } else {
            Write-Host "requirements.txt not found; continuing."
          }
          pip install pyinstaller

      - name: Guard - check entry point exists
        id: guard
        shell: pwsh
        run: |
          if (Test-Path "src/main.py") {
            "entry=src/main.py" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } elseif (Test-Path "main.py") {
            "entry=main.py" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Error "No entry point (src/main.py or main.py) found. Production release requires a build target."
            exit 1
          }

      - name: PyInstaller build
        shell: pwsh
        run: |
          pyinstaller --onefile --name AnsiseongDefense --noconfirm ${{ steps.guard.outputs.entry }}

      - name: Determine version / tag
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF -replace "refs/tags/", ""
            "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "is_tag=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            $tag = "v0.0.0-prd-${{ github.run_number }}"
            "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "is_tag=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          Write-Host "Resolved tag: $tag"

      - name: Extract release notes from CHANGELOG (best effort)
        id: notes
        shell: pwsh
        run: |
          $notesPath = "RELEASE_NOTES.md"
          if (Test-Path "CHANGELOG.md") {
            $content = Get-Content CHANGELOG.md -Raw
            # 가장 최근 버전 섹션( "## [x.y.z]" ) 추출
            $pattern = "(?ms)^##\s+\[[^\]]+\][^\n]*\n(.*?)(?=^##\s+\[|\z)"
            $m = [regex]::Match($content, $pattern)
            if ($m.Success) {
              Set-Content -Path $notesPath -Value $m.Value -Encoding UTF8
            } else {
              Set-Content -Path $notesPath -Value "자동 릴리즈. 상세 내역은 CHANGELOG.md 참조." -Encoding UTF8
            }
          } else {
            Set-Content -Path $notesPath -Value "자동 릴리즈." -Encoding UTF8
          }
          "path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release + attach .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: ${{ steps.ver.outputs.is_tag == 'false' }}
          files: dist/AnsiseongDefense.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
